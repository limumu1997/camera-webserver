<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32-S3 摄像头控制台</title>
  <style>
    :root{color-scheme:dark;--bg:#111413;--panel:#202523;--panel2:#171b1a;--line:#343b38;--text:#e7eeeb;--muted:#93a19c;--accent:#64e6d0;--blue:#68a7ff;--warn:#f5c35b;--bad:#ff6f91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#28302e 0,#111413 42%,#0b0d0c 100%);color:var(--text);font:12.5px/1.3 "Trebuchet MS","Microsoft YaHei",sans-serif;letter-spacing:0}button,input,select{font:inherit}button{border:1px solid var(--line);background:#242b29;color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#1d4f55;border-color:#43c9c0}button.warn{color:var(--warn);border-color:#8a6b2b}button.bad{color:var(--bad);border-color:#8d4055}.app{min-height:100vh;padding:12px;display:grid;grid-template-columns:minmax(240px,380px) minmax(400px,1fr) minmax(240px,380px);gap:15px}header{grid-column:1/4;text-align:center;color:var(--accent);font-size:20px;font-weight:800;letter-spacing:.04em}.stack{display:flex;flex-direction:column;gap:8px}.panel{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 10px 25px rgba(0,0,0,.2)}.panel h2{margin:0 0 10px;color:var(--accent);font-size:13px}.row{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;margin:6px 0}.row.two{grid-template-columns:100px 1fr}.muted{color:var(--muted)}.value{min-width:30px;text-align:right;color:#f4fbf8}select,input[type=password],input[type=text]{width:100%;border:1px solid #46504d;background:#2a312f;color:var(--text);border-radius:8px;padding:6px 8px;outline:none}input[type=range]{width:100%;accent-color:var(--accent)}input[type=file]{width:100%;color:var(--muted)}.switch{justify-self:end;position:relative;width:46px;height:24px}.switch input{display:none}.switch span{position:absolute;inset:0;background:#4b5552;border-radius:99px}.switch span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#dce7e3;transition:.15s}.switch input:checked+span{background:#45bdae}.switch input:checked+span:before{transform:translateX(22px)}.viewer{display:flex;flex-direction:column;gap:12px}.videoWrap{position:relative;background:#050706;border:1px solid #303936;border-radius:8px;overflow:hidden;min-height:300px;aspect-ratio:4/3}#stream{width:100%;height:100%;object-fit:contain;display:block}.badge{position:absolute;right:14px;top:14px;background:rgba(18,24,22,.78);border:1px solid #3c4844;border-radius:8px;padding:8px 12px;text-align:right;font-weight:800}.badge small{display:block;color:#d7e4df;font-weight:700}.bar{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}.bar .grow{flex:1}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:120px}.card h3{margin:0 0 8px;font-size:12px;color:var(--muted)}.big{font-size:22px;font-weight:900}.meter{height:8px;background:#2b3330;border-radius:99px;overflow:hidden;margin:7px 0}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#83f0bc);width:0}.meter.warn span{background:linear-gradient(90deg,var(--warn),#ff8c5a)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hidden{display:none}.status{color:var(--accent);font-weight:700}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2522;border:1px solid var(--accent);border-radius:8px;padding:10px 14px;opacity:0;transition:.18s}.toast.show{opacity:1}@media(max-width:1100px){.app{grid-template-columns:1fr;padding:14px}header{grid-column:1}.viewer{order:-1}.cards{grid-template-columns:1fr}.row{grid-template-columns:100px 1fr auto}}
  </style>
</head>
<body>
<main class="app">
  <header>ESP32-S3 摄像头控制台</header>
  <aside class="stack">
    <section class="panel"><h2>语言设置</h2><div class="row two"><label>显示语言</label><select id="language"><option value="zh">中文</option><option value="auto">自动</option></select></div></section>
    <section class="panel"><h2>设备列表</h2><div class="bar"><span class="status">1</span><span class="grow">客户端</span><button id="refresh">刷新</button></div><p class="muted">当前为单设备控制台。STA 失败时会自动开启配置热点。</p></section>
    <section class="panel"><h2>摄像头初始化参数</h2>
      <div class="row two"><label>分辨率</label><select id="framesize"><option value="10">640x480</option><option value="11">800x600</option><option value="12">1024x768</option><option value="13">1280x720</option><option value="14">1280x1024</option><option value="15">1600x1200</option></select></div>
      <div class="row two"><label>编码模式</label><select disabled><option>MJPEG</option></select></div>
      <div class="row"><label>质量</label><input id="quality" type="range" min="4" max="30"><span class="value" data-for="quality"></span></div>
      <div class="row"><label>XCLK</label><input id="xclk_mhz" type="range" min="5" max="24"><span class="value" data-for="xclk_mhz"></span></div>
      <div class="row two"><label>缓冲帧数</label><select id="fb_count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
      <div class="row two"><label>缓冲区</label><select disabled><option>PSRAM</option></select></div>
      <div class="actions"><button id="loadConfig">读取参数</button><button id="saveConfig" class="primary">保存并应用</button><button id="capture">抓拍</button></div>
    </section>
    <section class="panel"><h2>翻转与测试</h2>
      <div class="row"><label>水平镜像</label><span></span><label class="switch"><input id="hmirror" type="checkbox"><span></span></label></div>
      <div class="row"><label>垂直翻转</label><span></span><label class="switch"><input id="vflip" type="checkbox"><span></span></label></div>
      <div class="row"><label>色条测试</label><span></span><label class="switch"><input id="colorbar" type="checkbox"><span></span></label></div>
    </section>
  </aside>
  <section class="viewer">
    <div class="videoWrap"><img id="stream" alt="camera stream"><div class="badge"><span id="fps">0 FPS</span><small id="clock">--:--:--</small></div></div>
    <div class="bar"><span class="status" id="clientCount">1</span><span class="grow">客户端</span><button id="toggleStream" class="primary">停止</button><button id="wifiBtn">WiFi 配置</button><button id="otaBtn">OTA 升级</button><button id="rebootBtn" class="warn">重启设备</button><button id="resetBtn" class="bad">重置配置</button></div>
    <div class="cards">
      <div class="card"><h3>系统状态</h3><div>内存 <b id="heapText">--</b></div><div class="meter warn"><span id="heapBar"></span></div><div>PSRAM <b id="psramText">--</b></div><div class="meter"><span id="psramBar"></span></div><div class="muted">温度 <span id="tempText">--</span> | CPU <span id="cpuText">--</span></div></div>
      <div class="card"><h3>摄像头</h3><div class="big" id="frameSizeText">-- KB</div><div>抓帧 FPS <b id="camFps">--</b></div><div class="meter"><span id="fpsBar"></span></div><div class="muted">抓帧耗时 <span id="frameMs">--</span> ms</div></div>
      <div class="card"><h3>带宽</h3><div class="big" id="bandwidth">--</div><div>推流 FPS <b id="sendFps">--</b></div><div class="meter"><span id="sendBar"></span></div><div class="muted">IP <span id="ipText">--</span></div></div>
    </div>
  </section>
  <aside class="stack">
    <section class="panel"><h2>画面调节</h2>
      <div class="row"><label>亮度</label><input id="brightness" type="range" min="-2" max="2"><span class="value" data-for="brightness"></span></div>
      <div class="row"><label>对比度</label><input id="contrast" type="range" min="-2" max="2"><span class="value" data-for="contrast"></span></div>
      <div class="row"><label>饱和度</label><input id="saturation" type="range" min="-2" max="2"><span class="value" data-for="saturation"></span></div>
      <div class="row"><label>锐度</label><input id="sharpness" type="range" min="-2" max="2"><span class="value" data-for="sharpness"></span></div>
    </section>
    <section class="panel"><h2>白平衡</h2>
      <div class="row"><label>自动 AWB</label><span></span><label class="switch"><input id="awb" type="checkbox"><span></span></label></div>
      <div class="row"><label>AWB 增益</label><span></span><label class="switch"><input id="awb_gain" type="checkbox"><span></span></label></div>
      <div class="row two"><label>WB 模式</label><select id="wb_mode"><option value="0">自动</option><option value="1">晴天</option><option value="2">阴天</option><option value="3">办公室</option><option value="4">家庭</option></select></div>
    </section>
    <section class="panel"><h2>曝光</h2>
      <div class="row"><label>自动曝光</label><span></span><label class="switch"><input id="aec" type="checkbox"><span></span></label></div>
      <div class="row"><label>AEC DSP</label><span></span><label class="switch"><input id="aec2" type="checkbox"><span></span></label></div>
      <div class="row"><label>曝光补偿</label><input id="ae_level" type="range" min="-2" max="2"><span class="value" data-for="ae_level"></span></div>
      <div class="row"><label>曝光值</label><input id="aec_value" type="range" min="0" max="1200"><span class="value" data-for="aec_value"></span></div>
    </section>
    <section class="panel"><h2>增益</h2>
      <div class="row"><label>自动增益</label><span></span><label class="switch"><input id="agc" type="checkbox"><span></span></label></div>
      <div class="row"><label>AGC 增益</label><input id="agc_gain" type="range" min="0" max="30"><span class="value" data-for="agc_gain"></span></div>
      <div class="row two"><label>增益上限</label><select id="gainceiling"><option value="0">2x</option><option value="1">4x</option><option value="2">8x</option><option value="3">16x</option><option value="4">32x</option><option value="5">64x</option><option value="6">128x</option></select></div>
    </section>
    <section class="panel"><h2>特效与修正</h2>
      <div class="row two"><label>特效</label><select id="special_effect"><option value="0">无</option><option value="1">负片</option><option value="2">灰度</option><option value="3">红色</option><option value="4">绿色</option><option value="5">蓝色</option><option value="6">复古</option></select></div>
      <div class="row"><label>坏点校正</label><span></span><label class="switch"><input id="bpc" type="checkbox"><span></span></label></div>
      <div class="row"><label>白点校正</label><span></span><label class="switch"><input id="wpc" type="checkbox"><span></span></label></div>
      <div class="row"><label>Gamma</label><span></span><label class="switch"><input id="raw_gma" type="checkbox"><span></span></label></div>
      <div class="row"><label>镜头补偿</label><span></span><label class="switch"><input id="lenc" type="checkbox"><span></span></label></div>
    </section>
  </aside>
</main>
<div class="toast" id="toast"></div>
<dialog id="wifiDialog"><form method="dialog" class="panel"><h2>WiFi 配置</h2><div class="row two"><label>SSID</label><input id="wifiSsid" type="text"></div><div class="row two"><label>密码</label><input id="wifiPass" type="password"></div><div class="actions"><button value="cancel">取消</button><button id="wifiSave" value="default" class="primary">保存</button></div></form></dialog>
<dialog id="otaDialog"><form method="dialog" class="panel"><h2>OTA 升级</h2><input id="firmware" type="file" accept=".bin"><p class="muted" id="otaState">选择 PlatformIO 生成的 firmware.bin</p><div class="actions"><button value="cancel">取消</button><button id="otaUpload" value="default" class="primary">上传</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id), toast=$('toast'), stream=$('stream'); let streaming=true, cfg={}, metricsTimer=0;
const controlMap=['framesize','quality','brightness','contrast','saturation','sharpness','awb','awb_gain','wb_mode','aec','aec2','ae_level','aec_value','agc','agc_gain','gainceiling','hmirror','vflip','special_effect','bpc','wpc','raw_gma','lenc','colorbar'];
function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function val(id){const e=$(id);return e.type==='checkbox'?(e.checked?1:0):Number(e.value)}
function setVal(id,v){const e=$(id);if(!e)return;if(e.type==='checkbox')e.checked=!!v;else e.value=v;const out=document.querySelector(`[data-for="${id}"]`);if(out)out.textContent=e.value}
async function getJson(u){const r=await fetch(u,{cache:'no-store'});return r.json()}
async function postJson(u,o){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});return r.json()}
async function control(id){await fetch(`/control?var=${id}&val=${val(id)}`); if(cfg[id]!==undefined)cfg[id]=val(id)}
function startStream(){stream.src=`${location.protocol}//${location.hostname}:81/stream?t=${Date.now()}`;streaming=true;$('toggleStream').textContent='停止'}
function stopStream(){stream.removeAttribute('src');streaming=false;$('toggleStream').textContent='开始'}
async function loadConfig(){cfg=await getJson('/config');Object.keys(cfg).forEach(k=>setVal(k,cfg[k]));let st=await getJson('/status');Object.keys(st).forEach(k=>setVal(k,st[k]));$('wifiSsid').value=cfg.ssid||'';say('参数已读取')}
async function saveConfig(){for(const id of controlMap){if($(id))cfg[id]=val(id)}cfg.xclk_mhz=val('xclk_mhz');cfg.fb_count=val('fb_count');cfg.language=$('language').value;let r=await postJson('/config',cfg);say(r.message||'saved')}
async function refreshMetrics(){try{const m=await getJson('/metrics');const s=m.stream||{},w=m.wifi||{};$('fps').textContent=(s.fps||0).toFixed(1)+' FPS';$('camFps').textContent=(s.fps||0).toFixed(1);$('sendFps').textContent=(s.fps||0).toFixed(1);$('frameMs').textContent=s.avg_frame_ms||0;$('frameSizeText').textContent=((s.avg_frame_size||0)/1024).toFixed(2)+' KB';$('bandwidth').textContent=((s.bandwidth_kbps||0)/8192).toFixed(2)+' MB/s';$('clientCount').textContent=s.clients||0;$('ipText').textContent=w.ip||w.ap_ssid||'--';$('tempText').textContent=m.temperature_c==null?'--':m.temperature_c.toFixed(1)+'°C';$('cpuText').textContent=m.cpu0==null?'--':m.cpu0.toFixed(0)+'% / '+m.cpu1.toFixed(0)+'%';let hf=m.heap_free||0,pt=m.psram_total||1,pf=m.psram_free||0;$('heapText').textContent=(hf/1024).toFixed(0)+' KB';$('heapBar').style.width=Math.min(100,hf/3276)+'%';$('psramText').textContent=(pf/1048576).toFixed(2)+' MB';$('psramBar').style.width=Math.max(0,Math.min(100,pf*100/pt))+'%';$('fpsBar').style.width=Math.min(100,(s.fps||0)*5)+'%';$('sendBar').style.width=Math.min(100,(s.fps||0)*5)+'%'}catch(e){}}
controlMap.forEach(id=>{addEventListener('change',e=>{if(e.target&&e.target.id===id)control(id)});addEventListener('input',e=>{if(e.target&&e.target.id===id){const out=document.querySelector(`[data-for="${id}"]`);if(out)out.textContent=e.target.value}})});
$('toggleStream').onclick=()=>streaming?stopStream():startStream();$('capture').onclick=()=>open('/capture','_blank');$('loadConfig').onclick=loadConfig;$('saveConfig').onclick=saveConfig;$('refresh').onclick=()=>{loadConfig();refreshMetrics()};$('wifiBtn').onclick=()=>$('wifiDialog').showModal();$('otaBtn').onclick=()=>$('otaDialog').showModal();$('rebootBtn').onclick=async()=>{if(confirm('确认重启设备？')){await fetch('/reboot',{method:'POST'});say('正在重启')}};$('resetBtn').onclick=()=>say('请使用 WiFi/AP 重新写入配置');
$('wifiSave').onclick=async e=>{e.preventDefault();let r=await postJson('/wifi',{ssid:$('wifiSsid').value,password:$('wifiPass').value});$('wifiDialog').close();say(r.message||'wifi saved')};
$('otaUpload').onclick=async e=>{e.preventDefault();const f=$('firmware').files[0];if(!f){say('请选择固件');return}$('otaState').textContent='上传中...';let r=await fetch('/ota',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});let j=await r.json();$('otaState').textContent=j.message||'';say(j.message||'OTA 完成')};
setInterval(()=>{const d=new Date();$('clock').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':')},1000);loadConfig().finally(()=>{startStream();refreshMetrics();metricsTimer=setInterval(refreshMetrics,1000)});
</script>
</body>
</html>
